<!DOCTYPE html>
<html>
<head>
  <title>Favicon Generator</title>
  <style>
    body { background: #1a1a2e; display: flex; gap: 20px; padding: 40px; }
    .favicon-preview { width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(135deg, #FF7A3D, #FF5C35, #4D7CFF); display: flex; align-items: center; justify-content: center; animation: spin 3s linear infinite; }
    .favicon-preview div { width: 20px; height: 20px; background: white; border-radius: 4px; transform: rotate(45deg); }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="favicon-preview">
    <div></div>
  </div>
  <p>Screenshot this or use the SVG code above</p>
</body>
</html>
